services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: eduquest-backend
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      # Du lieu SQLite + backup song tren host (./data), mount vao /data
      - ./data:/data
    environment:
      - DATA_DIR=/data
      - PORT=8000
      - PYTHONUNBUFFERED=1
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: eduquest-frontend
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      - FRONTEND_PORT=3000
      - VITE_PROXY_HOST=backend
      - BACKEND_PORT=8000
    depends_on:
      - backend
    restart: unless-stopped
