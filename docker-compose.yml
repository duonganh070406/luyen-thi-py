services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: eduquest-backend
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      # Du lieu SQLite + backup song tren host (./data), mount vao /data
      - ./data:/data
    environment:
      - DATA_DIR=/data
      - PORT=8000
      - PYTHONUNBUFFERED=1
      - APP_NAME=${APP_NAME:-}
      - APP_VERSION=${APP_VERSION:-}
      - BACKEND_URL=${BACKEND_URL:-}
      - JWT_SECRET=${JWT_SECRET:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-}
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: eduquest-frontend
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      - FRONTEND_PORT=3000
      - VITE_PROXY_HOST=backend
      - BACKEND_PORT=8000
      - VITE_APP_NAME=${APP_NAME:-}
      - VITE_APP_VERSION=${APP_VERSION:-}
      - VITE_API_BASE_URL=${VITE_API_BASE_URL:-}
    depends_on:
      - backend
    restart: unless-stopped
